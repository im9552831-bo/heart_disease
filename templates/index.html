<!DOCTYPE html>
<html>
<head>
    <title>Heart Disease Prediction</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 90%;
            max-width: 1000px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #d62828;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        input {
            padding: 14px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #d62828;
            box-shadow: 0 0 5px rgba(214, 40, 40, 0.4);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #d62828;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #a4161a;
            transform: scale(1.02);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            text-align: center;
            background: #f1f8f4;
            border-left: 6px solid #2a9d8f;
            border-radius: 10px;
            color: #222;
            font-size: 22px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>

</head>

<body>

<div class="container">
    <div class="card">
        <h1>Heart Disease Prediction</h1>
        <p class="subtitle">Enter details to check risk</p>

        <form action="/predict" method="POST">

            <div class="grid">
                <input type="number" name="age" placeholder="Age" required>
                <input type="number" name="sex" placeholder="Sex (1=Male, 0=Female)" required>
                <input type="number" name="cp" placeholder="Chest Pain Type" required>
                <input type="number" name="trestbps" placeholder="Resting BP" required>
                <input type="number" name="chol" placeholder="Cholesterol" required>
                <input type="number" name="fbs" placeholder="Fasting Blood Sugar" required>
                <input type="number" name="restecg" placeholder="Rest ECG" required>
                <input type="number" name="thalach" placeholder="Max Heart Rate" required>
                <input type="number" name="exang" placeholder="Exercise Angina" required>
                <input type="number" step="0.1" name="oldpeak" placeholder="Oldpeak" required>
                <input type="number" name="slope" placeholder="Slope" required>
                <input type="number" name="ca" placeholder="CA" required>
                <input type="number" name="thal" placeholder="Thal" required>
            </div>

            <button type="submit">Predict</button>
        </form>

        {% if prediction_text %}
        <div class="result">
            {{ prediction_text }}
        </div>
        {% endif %}

    </div>
</div>

</body>
</html>
